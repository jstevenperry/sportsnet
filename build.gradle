plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jstevenperry'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    dl4jVersion = '1.0.0-M2.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'com.google.guava:guava:33.4.8-jre'
    implementation 'com.opencsv:opencsv:5.11'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    implementation "org.deeplearning4j:deeplearning4j-core:${dl4jVersion}"
    runtimeOnly "org.nd4j:nd4j-native-platform:${dl4jVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    mainClass = 'com.jstevenperry.sportsnet.ncaabb.SportsnetNcaaBbApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
