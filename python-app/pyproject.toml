[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sportsnet-python"
version = "0.1.0"
description = "Combined NCAA basketball and MLB model-serving application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.0",
  "keras==3.12.0",
  "numpy==2.2.6",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "tensorflow==2.20.0",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
]

[project.scripts]
sportsnet = "sportsnet.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sportsnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: pure domain and application tests",
  "repository: filesystem and SQLite tests",
  "keras: TensorFlow/Keras adapter tests",
  "api: FastAPI contract tests",
  "e2e: end-to-end application tests",
  "integration: integration tests across application components",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keras.*", "tensorflow.*"]
ignore_missing_imports = true
